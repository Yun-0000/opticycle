name: Keyless proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python3 -m pip install -e .
      - name: Zero-resubmit invariant
        run: python3 scripts/assert-zero-resubmit.py
      - name: Exits-only contract
        run: python3 scripts/assert-exits-only.py
      - name: Public evidence scan
        run: python3 scripts/scan-public-evidence.py
      - name: Keyless dry-run
        run: python3 -m opticycle run --profile hackathon --backend mcp --once --dry-run
