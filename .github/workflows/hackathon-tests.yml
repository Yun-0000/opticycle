name: Hackathon tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: vendor/pin-31374551:src
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-hackathon.txt
      - name: Syntax check
        run: python3 -m compileall src/ scripts/
      - name: Pytest
        run: python3 -m pytest tests/ -q
      - name: Secret scan public evidence
        run: python3 scripts/scan-public-evidence.py
      - name: Keyless public-evidence replay
        run: python3 scripts/replay-public-evidence.py
      - name: Credential-free zero-resubmit assertion
        run: python3 scripts/assert-zero-resubmit.py
      - name: Demo facts match public evidence
        run: python3 scripts/verify-demo-evidence.py
      - name: Verify dry-run MCP path
        run: python3 scripts/verify-paper-mcp-order.py --dry-run
      - name: One autonomous dry-run cycle
        run: python3 -m opticycle run --profile hackathon --backend mcp --once --dry-run
      - name: Live-fill ledger path is dry-run only
        run: python3 scripts/record-live-fill-episode.py --dry-run
      - name: Genuine NO_TRADE probe without keys
        run: python3 scripts/record-genuine-no-trade.py
      - name: Paper-fill ingest hook waits without JSON
        run: python3 scripts/ingest-paper-fill.py
      - name: Open-session hook without keys does not submit
        run: python3 scripts/run-open-session.py
