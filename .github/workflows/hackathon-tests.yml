name: Hackathon tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: vendor/pin-31374551:src
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-hackathon.txt
      - name: Syntax check
        run: python3 -m compileall src/ scripts/verify-paper-mcp-order.py
      - name: Pytest
        run: python3 -m pytest tests/ -q
      - name: Verify dry-run MCP path
        run: python3 scripts/verify-paper-mcp-order.py --dry-run
      - name: One autonomous dry-run cycle
        run: python3 -m opticycle run --profile hackathon --backend mcp --once --dry-run
